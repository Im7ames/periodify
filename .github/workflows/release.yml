name: Release packages
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - run: flutter analyze && flutter test && flutter build web --release
      - run: cd build/web && zip -r ../../periodify-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: periodify-web.zip
  deploy:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: web
      - run: unzip -q periodify-web.zip -d build/web
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Deploy and verify Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WEB_URL: ${{ vars.PERIODIFY_WEB_URL }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$WEB_URL" || { echo 'Missing PERIODIFY_WEB_URL'; exit 1; }
          pnpm install --frozen-lockfile
          pnpm exec cf deploy ./build/web
          curl --fail --retry 5 --retry-delay 5 "${WEB_URL%/}/version.json?release=${TAG}" | jq -e --arg version "${TAG#v}" '.version == $version'
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - name: Restore existing signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" || { echo 'Missing Android signing secrets. No keys will be generated.'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(sed -n 's/^version: .*+\([0-9]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"
      - run: flutter pub get && flutter build apk --release
      - run: cd android && chmod +x gradlew && ./gradlew :wear:assembleRelease
      - name: Collect and verify APK signatures
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/periodify-android.apk
          cp build/wear/outputs/apk/release/wear-release.apk artifacts/periodify-wear-os.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs artifacts/periodify-android.apk > phone-cert.txt
          "$APKSIGNER" verify --print-certs artifacts/periodify-wear-os.apk > watch-cert.txt
          diff <(grep 'certificate SHA-256 digest' phone-cert.txt) <(grep 'certificate SHA-256 digest' watch-cert.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - name: Build and sign Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: ./scripts/package-windows.ps1
      - name: Build and sign macOS
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/package-macos.sh
      - name: Build and sign Linux
        if: runner.os == 'Linux'
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: artifacts/*
  publish:
    needs: [web, android, desktop]
    if: ${{ !cancelled() && needs.web.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload checksums, feeds, packages and download table
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
