name: Publish Periodify release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag, for example v0.1.4. Select that ref to publish.
        required: true
        type: string
      dry_run:
        description: Build and verify packages without changing a release
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: app-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false
env:
  TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify source version and tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_LINE=$(sed -n 's/^version: //p' pubspec.yaml)
          if [[ ! "$VERSION_LINE" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([1-9][0-9]*)$ ]]; then
            echo 'pubspec.yaml must set the version and a positive Android build number.'
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          CODE="${BASH_REMATCH[2]}"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "Select the source for v$VERSION or update pubspec.yaml."
            exit 1
          fi
          if [[ "$DRY_RUN" != "true" ]]; then
            TAG_COMMIT=$(gh api "/repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
            if [[ "$TAG_COMMIT" != "$(git rev-parse HEAD)" ]]; then
              echo 'Run the publishing workflow from the release tag.'
              exit 1
            fi
            gh release view "$TAG" --json isDraft --jq 'if .isDraft then error("Publish the GitHub release first") else true end'
          fi
          printf 'version=%s\ncode=%s\n' "$VERSION" "$CODE" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      release_version: ${{ needs.version.outputs.version }}
      android_version_code: ${{ needs.version.outputs.code }}
    secrets: inherit
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: periodify-*
          path: artifacts
          merge-multiple: true
      - name: Prepare installers, checksums and update manifest
        run: node scripts/publish-release.mjs --prepare
      - name: Attach installers, then publish the update manifest
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs --publish
      - uses: actions/upload-artifact@v4
        if: env.DRY_RUN == 'true'
        with:
          name: release-preview
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: [build, publish]
    if: ${{ vars.PERIODIFY_DEPLOY_WEB == 'true' && (github.event_name == 'release' || !inputs.dry_run) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: periodify-web
      - run: mkdir -p build/web && unzip -q periodify-web.zip -d build/web
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Deploy the verified web ZIP
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WEB_URL: ${{ vars.PERIODIFY_WEB_URL }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$WEB_URL" || { echo 'Configure the Cloudflare credentials and live URL first.'; exit 1; }
          pnpm install --frozen-lockfile
          pnpm exec cf deploy ./build/web
          curl --fail --retry 5 --retry-delay 5 "${WEB_URL%/}/build-info.json?release=${TAG}" |
            jq -e --arg release "$TAG" --arg commit "$(git rev-parse HEAD)" '.release == $release and .commit == $commit'
